name: Mirror to Forgejo & Create Test Release

on:
  push:
    branches:
      - main
    paths:
      - 'appinfo/info.xml' # Pipeline startet NUR, wenn die info.xml geändert wurde!

jobs:
  mirror_and_release:
    runs-on: ubuntu-latest
    steps:
      # 1. Code aus GitHub auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Brauchen wir, um den vorherigen Commit mit dem aktuellen zu vergleichen

      # 2. Versions-Tag aus der info.xml extrahieren
      - name: Get Version from info.xml
        id: get_version
        run: |
          # Extrahiert den Inhalt zwischen <version>...</version>
          VERSION=$(xmllint --xpath "string(//info/version)" appinfo/info.xml 2>/dev/null || grep -oP '(?<=<version>).*?(?=</version>)' appinfo/info.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Gefundene App-Version: $VERSION"

      # 3. Prüfen, ob sich die Version im Vergleich zum letzten Commit WIRKLICH geändert hat
      - name: Check if Version Changed
        id: check_version
        run: |
          # Holt die info.xml aus dem vorherigen Commit
          git show HEAD~1:appinfo/info.xml > old_info.xml 2>/dev/null || echo "" > old_info.xml
          OLD_VERSION=$(xmllint --xpath "string(//info/version)" old_info.xml 2>/dev/null || grep -oP '(?<=<version>).*?(?=</version>)' old_info.xml || echo "0.0.0")
          
          if [ "$VERSION" = "$OLD_VERSION" ]; then
            echo "Version hat sich nicht geändert ($VERSION). Breche ab."
            exit 0
          fi
          echo "Version hat sich von $OLD_VERSION auf $VERSION geändert. Fahre fort..."

      # 4. Code zu Forgejo spiegeln
      - name: Push to Forgejo Mirror
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          git remote add forgejo https://${{ secrets.FORGEJO_TOKEN }}@git.24wt.de/zomtec2311/${{ github.event.repository.name }}.git
          git push -f forgejo HEAD:main

      # 5. Ein ECHTES Git-Tag lokal erstellen und zu Forgejo pushen
      # Das triggert Forgejos Webhook garantiert als "create (tag)"-Event!
      - name: Push Tag to Forgejo
        run: |
          # Erstellt das exakte Test-Tag-Format (z.B. v1.5.6-test.5)
          TAG_NAME="v${{ env.VERSION }}-test.${{ github.run_number }}"
          
          # Tag lokal setzen
          git tag $TAG_NAME
          
          # Tag zu Forgejo pushen
          git push forgejo $TAG_NAME
